<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>预览</title>
<style>
  :root { --bg:#0d0d0d; --fg:#f0efec; --line:#2e2e2c; --series:#9085e9; --accent:#c98500; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.6 "PingFang SC","Hiragino Sans GB",system-ui,sans-serif; }

  header { position:sticky; top:0; z-index:10; background:rgba(8,8,8,.88);
           backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
           padding:10px 14px; display:flex; flex-direction:column; gap:9px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .mono { font-family:"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
  button { background:#1b1b1a; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 11px; cursor:pointer; font:inherit; }
  button:hover { background:#262624; border-color:#3d3d3a; }
  button:active { transform:translateY(1px); }
  select { background:#1b1b1a; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:5px 8px; font:inherit; }
  input[type=range] { flex:1; min-width:240px; accent-color:var(--series); }
  #readout { min-width:190px; color:#b9b8ad; }
  #readout b { color:var(--accent); }
  #slug { color:var(--series); font-weight:600; }
  .hint { color:#77766e; font-size:12px; }

  #grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:12px; }
  .cell { position:relative; border:1px solid var(--line); border-radius:9px;
          overflow:hidden; background:#1a1a19; transition:opacity .15s, border-color .15s; }
  .cell.on { border-color:var(--series); }
  .cell.dim { opacity:.22; }
  .box { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; }
  iframe { position:absolute; top:0; left:0; width:1920px; height:1080px;
           border:0; transform-origin:0 0; }
  .cap { position:absolute; left:9px; bottom:9px; background:rgba(0,0,0,.66);
         padding:3px 9px; border-radius:6px; font-size:12px; display:flex; gap:9px; }
  .cap b { color:var(--series); }
  .cap .lt { color:#c3c2b7; }
  .cap .bad { color:#ff6b6b; }
</style>
</head>
<body>

<header>
  <div class="row">
    <span id="slug">…</span>
    <span class="hint" id="summary"></span>
  </div>
  <div class="row">
    <button id="play">▶ 播放</button>
    <button id="prev" title="上一帧（←）">◀|</button>
    <button id="next" title="下一帧（→）">|▶</button>
    <select id="only"></select>
    <input type="range" id="scrub" min="0" max="1" step="0.0333" value="0">
    <span id="readout" class="mono"></span>
  </div>
  <div class="hint">空格 播放/暂停　←/→ 逐帧　拖动时间轴看某一刻。改了场景存盘后刷新本页。</div>
</header>

<div id="grid"></div>

<script>
(async () => {
  const meta = await (await fetch("/__meta.json")).json();
  const FPS = meta.fps;
  const STEP = 1 / FPS;

  document.getElementById("slug").textContent = meta.slug;
  document.getElementById("summary").textContent =
    `${meta.shots.length} 个镜头 · 共 ${meta.total}s · ${meta.fps}fps`;

  const cells = {};
  const grid = document.getElementById("grid");

  for (const s of meta.shots) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML =
      `<div class="box"><iframe scrolling="no" src="/__scene/${s.id}.html"></iframe></div>` +
      `<div class="cap"><b>${s.id}</b><span class="lt mono">t=0.00s</span>` +
      `<span>${s.dur}s</span><span class="bad"></span></div>`;
    grid.appendChild(cell);
    const f = cell.querySelector("iframe");
    cells[s.id] = {
      cell, f, box: cell.querySelector(".box"),
      lt: cell.querySelector(".lt"), bad: cell.querySelector(".bad"), s,
    };
    f.addEventListener("load", () => {
      // 场景坏了要看得见，而不是静静留一片黑
      if (typeof f.contentWindow.render !== "function") {
        cells[s.id].bad.textContent = "⚠ 没拿到 window.render";
      }
      fit(); draw();
    });
  }

  function fit() {
    for (const id in cells) {
      const { f, box } = cells[id];
      f.style.transform = `scale(${(box.clientWidth / 1920).toFixed(5)})`;
    }
  }
  addEventListener("resize", fit);

  /* ── 时间轴状态 ─────────────────────────────── */
  let g = 0, playing = false, only = "all";

  const bounds = () => only === "all"
    ? [0, meta.total]
    : [cells[only].s.start, cells[only].s.start + cells[only].s.dur];

  const scrub = document.getElementById("scrub");
  const readout = document.getElementById("readout");
  const playBtn = document.getElementById("play");
  const onlySel = document.getElementById("only");

  onlySel.innerHTML = `<option value="all">全部镜头</option>` +
    meta.shots.map((s) => `<option value="${s.id}">${s.id} 单独看</option>`).join("");

  function draw() {
    for (const id in cells) {
      const { f, cell, lt, s } = cells[id];
      const local = Math.min(Math.max(g - s.start, 0), s.dur);
      try {
        const w = f.contentWindow;
        if (w && typeof w.render === "function") w.render(local);
      } catch (e) { /* 场景还没就绪，下一次再画 */ }
      lt.textContent = `t=${local.toFixed(2)}s`;
      cell.classList.toggle("dim", only !== "all" && id !== only);
      cell.classList.toggle("on", only !== "all" && id === only);
    }
    scrub.value = String(g);
    // 全部镜头时，标出当前时间落在哪一镜里
    const cur = meta.shots.find((s) => g >= s.start && g < s.start + s.dur);
    readout.innerHTML = only === "all"
      ? `${g.toFixed(2)}s / ${meta.total}s　<b>${cur ? cur.id : "—"} +${cur ? (g - cur.start).toFixed(2) : "0.00"}s</b>`
      : `${g.toFixed(2)}s / ${bounds()[1].toFixed(2)}s　<b>${only}</b>`;
  }

  function setBounds() {
    const [a, b] = bounds();
    if (g < a || g > b) g = a;
    scrub.min = String(a); scrub.max = String(b); scrub.step = String(STEP);
    draw();
  }

  let last = 0;
  function tick(ts) {
    const dt = last ? Math.min((ts - last) / 1000, 0.1) : 0;
    last = ts;
    if (playing) {
      const [a, b] = bounds();
      g += dt;
      if (g > b) g = a;             // 到头回到起点循环
      draw();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  const setPlay = (v) => {
    playing = v;
    playBtn.textContent = v ? "❚❚ 暂停" : "▶ 播放";
  };

  playBtn.onclick = () => setPlay(!playing);
  document.getElementById("prev").onclick = () => { setPlay(false); g = Math.max(bounds()[0], g - STEP); draw(); };
  document.getElementById("next").onclick = () => { setPlay(false); g = Math.min(bounds()[1], g + STEP); draw(); };
  scrub.oninput = () => { setPlay(false); g = Number(scrub.value); draw(); };
  onlySel.onchange = () => { only = onlySel.value; setBounds(); };

  addEventListener("keydown", (e) => {
    if (e.target === onlySel) return;
    if (e.code === "Space") { e.preventDefault(); setPlay(!playing); }
    else if (e.code === "ArrowLeft") { setPlay(false); g = Math.max(bounds()[0], g - STEP); draw(); }
    else if (e.code === "ArrowRight") { setPlay(false); g = Math.min(bounds()[1], g + STEP); draw(); }
  });

  setBounds();
})();
</script>
</body>
</html>
